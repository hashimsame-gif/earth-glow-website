    <h2 class="center">THE SCIENCE BEHIND THE SKIN.</h2>
    <p class="center muted narrow">Educational overview of the ideas that guide our thinking. It is not a statement of product performance.</p>
    <div class="science-visual">
      <figure><img class="round" src="images/lipid-bilayer-3d.jpg" width="1000" height="622" loading="lazy" alt="3D rendering of a lipid bilayer with molecules floating above it"><figcaption>Lipid bilayer, illustrative 3D rendering</figcaption></figure>
      <figure><img class="round diagram" src="images/skin-barrier-diagram.jpg" width="1400" height="858" loading="lazy" alt="Diagram of stratum corneum cells, lamellar lipids, ceramide, cholesterol and free fatty acid structures"><figcaption>Stratum corneum and lamellar lipids, simplified diagram. Real proportions vary between individuals and skin sites.</figcaption></figure>
    </div>
    <div class="topics">
      <article><h3>What is Biomimicry?</h3><p>Biomimicry looks to nature's own designs for ideas. In skincare, it means studying how skin is built and using that understanding to guide formulation thinking.</p></article>
      <article><h3>Understanding the Skin Barrier</h3><p>The outermost layer of skin, the stratum corneum, is often described as a "brick and mortar" structure: flattened cells (corneocytes) held together by a lipid-rich matrix.</p></article>
      <article><h3>Skin Lipids and Barrier Architecture</h3><p>Between the cells, lipids arrange into ordered, layered structures known as lamellae. This arrangement is central to how the barrier is understood in skin science.</p></article>
      <article><h3>Ceramides, Cholesterol and Free Fatty Acids</h3><p>These three lipid families are the principal components of the intercellular lipid matrix. Their balance and organisation are a key area of skin barrier research.</p></article>
      <article><h3>Formulation Philosophy</h3><p>We look at the relationship between skin structure, ingredient function and professional application, so that each formulation decision has a clear purpose.</p></article>
      <article><h3>Ingredient Research</h3><p>Ingredient understanding comes before product claims. We review the science behind each material before it is considered for any formulation.</p></article>
    </div>
  </div>
</section>

<script>
/* ===== SETTINGS YOU CAN CHANGE ===== */
// Paste your form service address here (for example a Formspree link). Leave empty until connected.
const FORM_ENDPOINT = "";
const WHATSAPP_NUMBER = "918356902748"; // digits only, with country code
/* =================================== */

const header = document.querySelector('.site-header');
const burger = document.querySelector('.burger');
const nav = document.getElementById('nav');
burger.addEventListener('click', () => {
  const open = nav.classList.toggle('open');
  burger.setAttribute('aria-expanded', open);
});
nav.addEventListener('click', e => { if (e.target.tagName === 'A') { nav.classList.remove('open'); burger.setAttribute('aria-expanded', false); } });
addEventListener('scroll', () => header.classList.toggle('scrolled', scrollY > 10), { passive: true });

const form = document.getElementById('enquiry');
const status = document.getElementById('status');
const labels = { salon: 'business name', person: 'contact person', mobile: 'mobile number', email: 'email address', city: 'city', type: 'business type', message: 'message' };

function check(el) {
  const v = el.value.trim();
  let msg = '';
  if (!v) msg = 'Enter your ' + labels[el.name] + '.';
  else if (el.name === 'email' && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)) msg = 'Enter a valid email address.';
  else if (el.name === 'mobile' && !/^\+?[0-9\s-]{8,15}$/.test(v)) msg = 'Enter a valid mobile number (8 to 15 digits).';
  else if (el.name === 'message' && v.length < 10) msg = 'Write at least 10 characters.';
  el.parentElement.querySelector('.err').textContent = msg;
  el.setAttribute('aria-invalid', !!msg);
  return !msg;
}
form.querySelectorAll('input,select,textarea').forEach(el => el.addEventListener('blur', () => check(el)));

form.addEventListener('submit', async e => {
  e.preventDefault();
  const fields = [...form.querySelectorAll('input,select,textarea')];
  const bad = fields.filter(el => !check(el));
  status.hidden = false;
  if (bad.length) { bad[0].focus(); status.className = 'status bad'; status.textContent = 'Please correct the highlighted fields.'; return; }

  const data = Object.fromEntries(new FormData(form));
  if (!FORM_ENDPOINT) {
    const text = `New salon enquiry%0ABusiness: ${encodeURIComponent(data.salon)}%0AContact: ${encodeURIComponent(data.person)}%0AMobile: ${encodeURIComponent(data.mobile)}%0AEmail: ${encodeURIComponent(data.email)}%0ACity: ${encodeURIComponent(data.city)}%0AType: ${encodeURIComponent(data.type)}%0AMessage: ${encodeURIComponent(data.message)}`;
    status.className = 'status bad';
    status.innerHTML = 'This form is not connected to an email service yet, so nothing has been sent. You can send the same details by <a href="https://wa.me/' + WHATSAPP_NUMBER + '?text=' + text + '" target="_blank" rel="noopener">WhatsApp</a>.';
    return;
  }
  try {
    const res = await fetch(FORM_ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'application/json', Accept: 'application/json' }, body: JSON.stringify(data) });
    if (!res.ok) throw new Error(res.status);
    form.reset();
    status.className = 'status ok';
    status.textContent = 'Thank you. Your enquiry has been sent.';
  } catch (err) {
    status.className = 'status bad';
    status.textContent = 'Your enquiry could not be sent. Please try again or contact us on WhatsApp.';
  }
});

</script>
