<style>
:root{--ink:#191916;--paper:#f6f3ee;--cream:#ebe5dc;--white:#fffefa;--muted:#716e67;--line:#dcd5ca;--gold:#a58b6d;--deep:#25231f;--max:1240px}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:90px}body{margin:0;background:var(--paper);color:var(--ink);font-family:'DM Sans',sans-serif}a{color:inherit;text-decoration:none}img{display:block;max-width:100%}.wrap{width:min(var(--max),calc(100% - 64px));margin:auto}.serif{font-family:'Playfair Display',serif;font-weight:400}.eyebrow{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);font-weight:700}.topline{height:32px;background:var(--deep);color:#eee8df;display:flex;align-items:center;justify-content:center;font-size:9px;letter-spacing:.22em;text-transform:uppercase}
header{height:84px;position:sticky;top:0;z-index:50;background:rgba(246,243,238,.94);backdrop-filter:blur(14px);border-bottom:1px solid #0000000c}.nav{height:100%;display:flex;align-items:center;justify-content:space-between;gap:24px}.logo{width:205px;flex:0 0 205px}.logo img{width:100%;max-height:68px;object-fit:contain}.links{display:flex;align-items:center;gap:25px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#4d4a44}.links a:hover{color:var(--gold)}.nav-cta,.btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;padding:15px 22px;background:var(--ink);border:1px solid var(--ink);color:#fff;font-size:10px;letter-spacing:.13em;text-transform:uppercase;transition:.25s}.nav-cta:hover,.btn:hover{background:transparent;color:var(--ink)}.menu{display:none;background:none;border:0;font-size:26px;color:var(--ink)}
.hero{display:grid;grid-template-columns:.88fr 1.12fr;min-height:610px;background:#e9e3da}.hero-copy{padding:clamp(55px,8vw,112px) 4vw clamp(55px,7vw,90px) max(32px,calc((100vw - var(--max))/2)}.hero h1{font-size:clamp(46px,5.4vw,76px);line-height:1.02;letter-spacing:-.035em;margin:23px 0 20px}.hero h1 em{font-style:italic;color:#8d765e}.hero-copy p{max-width:440px;color:#625e57;font-size:15px;line-height:1.9;margin:0 0 28px}.hero-note{display:flex;align-items:center;gap:13px;margin-top:42px;color:#69645c;font-size:10px;letter-spacing:.14em;text-transform:uppercase}.hero-note:before{content:'';width:35px;height:1px;background:var(--gold)}.hero-visual{position:relative;min-height:610px;overflow:hidden;background:#d7cec2}.hero-visual img{width:100%;height:100%;position:absolute;inset:0;object-fit:cover;object-position:center 42%}.hero-visual:after{content:'';position:absolute;inset:45% 0 0;background:linear-gradient(transparent,#16130f66)}.hero-caption{position:absolute;bottom:30px;left:32px;z-index:1;color:white;font-size:10px;letter-spacing:.2em;text-transform:uppercase}
.benefits{background:var(--white);border-bottom:1px solid var(--line)}.benefit-row{display:grid;grid-template-columns:repeat(4,1fr)}.benefit{padding:25px 20px;display:flex;align-items:center;gap:14px;border-right:1px solid var(--line)}.benefit:last-child{border:0}.benefit .symbol{width:35px;height:35px;border:1px solid #b8a48b;border-radius:50%;display:grid;place-items:center;color:#8c765b;font-family:serif;font-size:18px;flex:0 0 auto}.benefit strong{display:block;font-family:'Playfair Display',serif;font-size:16px;font-weight:400}.benefit small{display:block;color:var(--muted);font-size:10px;margin-top:4px;line-height:1.5}
section{padding:100px 0}.intro-grid{display:grid;grid-template-columns:1fr 1fr;gap:75px;align-items:center}.intro-art{background:#eee9e1;padding:28px;border:1px solid var(--line)}.intro-art img{width:100%;height:380px;object-fit:contain;mix-blend-mode:multiply}.intro-copy h2,.science-copy h2,.partner-copy h2,.moor-copy h2{font-size:clamp(36px,4.2vw,57px);line-height:1.1;margin:18px 0}.intro-copy p,.science-copy p,.partner-copy p,.moor-copy p{font-size:14px;line-height:1.95;color:var(--muted)}.intro-quote{margin-top:30px;padding:18px 22px;border-left:2px solid var(--gold);font-family:'Playfair Display',serif;font-size:20px;line-height:1.5;color:#50483e}
.science{background:#eeebe5}.science-grid{display:grid;grid-template-columns:1fr 1fr;gap:70px;align-items:center}.science-visual{background:#fffefa;padding:22px;border:1px solid var(--line)}.science-visual img{width:100%;height:420px;object-fit:contain}.science-points{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:30px}.science-point{border-top:1px solid #c9c1b5;padding-top:13px}.science-point b{font-size:10px;letter-spacing:.12em;text-transform:uppercase}.science-point p{font-size:12px;margin:8px 0 0;line-height:1.7}
.product{background:#282621;color:#f6f1e8;overflow:hidden}.product-grid{display:grid;grid-template-columns:1fr 1fr;gap:70px;align-items:center}.product-visual{min-height:450px;display:grid;place-items:center;position:relative;background:radial-gradient(ellipse at 50% 55%,#777064 0%,#403d36 38%,#282621 72%)}.product-visual:before{content:'';position:absolute;width:300px;height:300px;border:1px solid #c7b69b44;border-radius:50%}.jar{position:relative;width:230px;filter:drop-shadow(0 30px 25px #0008);transform:translateY(12px)}.jar-lid{height:38px;width:218px;margin:auto;background:linear-gradient(90deg,#b8b2a6,#f1eee7 35%,#aaa396 75%,#ddd7cb);border-radius:7px 7px 3px 3px;border:1px solid #8e887e}.jar-body{height:185px;border-radius:9px 9px 28px 28px;background:linear-gradient(90deg,#c9c4b9,#f9f7f0 22%,#e7e2d8 75%,#b9b2a6);border:1px solid #b9b1a4;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#25231f;text-align:center;padding:18px}.jar-brand{font-family:'Playfair Display',serif;font-size:18px;letter-spacing:.05em}.jar-care{font-size:8px;letter-spacing:.38em;margin:4px 0 18px}.jar-name{font-size:9px;letter-spacing:.13em;text-transform:uppercase;border-top:1px solid #a69b8b;padding-top:10px;width:80%}.jar-sub{font-size:7px;letter-spacing:.14em;margin-top:6px}.product-stamp{position:absolute;bottom:24px;left:24px;color:#d9cbb6;font-size:9px;letter-spacing:.2em;text-transform:uppercase}.product-copy .eyebrow{color:#c4a98a}.product-copy h2{font-size:clamp(38px,4.5vw,58px);line-height:1.1;margin:18px 0}.product-copy p{color:#c9c1b5;font-size:14px;line-height:1.9}.product-facts{display:flex;gap:25px;margin:28px 0 34px;flex-wrap:wrap}.product-facts span{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#e1d5c4;border-left:1px solid #887a67;padding-left:12px}.product-copy .btn{background:#f3eee5;color:#25231f;border-color:#f3eee5}.product-copy .btn:hover{background:transparent;color:#fff}
.treatments{background:#e8e2d9}.section-head{text-align:center;max-width:740px;margin:0 auto 48px}.section-head h2{font-size:clamp(38px,4.4vw,58px);line-height:1.1;margin:17px 0}.section-head p{color:var(--muted);font-size:14px;line-height:1.8}.treatment-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}.treatment-card{position:relative;min-height:420px;overflow:hidden;background:#c8bfb3}.treatment-card img{width:100%;height:100%;position:absolute;inset:0;object-fit:cover;transition:transform .6s}.treatment-card:hover img{transform:scale(1.04)}.treatment-card:after{content:'';position:absolute;inset:45% 0 0;background:linear-gradient(transparent,#171512a8)}.treatment-label{position:absolute;bottom:28px;left:30px;z-index:1;color:white}.treatment-label small{font-size:9px;letter-spacing:.2em;text-transform:uppercase}.treatment-label h3{font-family:'Playfair Display',serif;font-size:31px;font-weight:400;margin:8px 0 0}
.partner{display:grid;grid-template-columns:1fr 1fr;gap:70px;align-items:center}.partner-photo{height:500px;overflow:hidden;background:#ddd}.partner-photo img{width:100%;height:100%;object-fit:cover}.partner-copy ul{list-style:none;padding:0;margin:25px 0 32px}.partner-copy li{padding:13px 0;border-bottom:1px solid var(--line);font-size:12px;color:#57534c}.partner-copy li:before{content:'✦';color:var(--gold);margin-right:12px}.partner-pillars{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:26px 0}.partner-pillars div{border-top:1px solid var(--line);padding-top:12px;font-family:'Playfair Display',serif;font-size:14px}.partner-pillars small{display:block;font:10px 'DM Sans',sans-serif;color:var(--muted);margin-top:5px;line-height:1.5}
.contact{background:#211f1b;color:#f4efe7;text-align:center;padding:85px 0}.contact .eyebrow{color:#c4a98a}.contact h2{font-size:clamp(40px,5vw,64px);margin:18px 0}.contact p{color:#c8c0b5;font-size:14px;line-height:1.8}.contact .btn{background:#f4efe7;color:#211f1b;border-color:#f4efe7;margin-top:18px}.contact .btn:hover{background:transparent;color:white}.contact-number{display:block;margin-top:20px;font-size:14px;letter-spacing:.08em;color:#fff}
footer{background:#171613;color:#bdb6ab;padding:30px 0}.footer-row{display:flex;justify-content:space-between;align-items:center;gap:20px;font-size:9px;letter-spacing:.13em;text-transform:uppercase}.footer-brand{color:white;font-family:'Playfair Display',serif;font-size:18px;letter-spacing:.05em}.wa{position:fixed;right:20px;bottom:20px;z-index:60;background:#211f1b;color:white;padding:14px 18px;border-radius:40px;font-size:10px;letter-spacing:.1em;box-shadow:0 8px 28px #0003}
@media(max-width:900px){.wrap{width:calc(100% - 40px)}.links{gap:13px;font-size:9px}.logo{width:165px;flex-basis:165px}.nav-cta{padding:12px 14px;font-size:9px}.hero-copy{padding:58px 30px}.hero{grid-template-columns:1fr}.hero-visual{min-height:430px}.benefit-row{grid-template-columns:1fr 1fr}.benefit:nth-child(2){border-right:0}.benefit:nth-child(-n+2){border-bottom:1px solid var(--line)}.intro-grid,.science-grid,.product-grid,.partner{grid-template-columns:1fr;gap:36px}.intro-art img{height:300px}.science-visual img{height:320px}.product-visual{min-height:380px;order:2}.product-copy{order:1}.partner-photo{height:400px}}
@media(max-width:650px){.topline{font-size:8px;letter-spacing:.12em}.wrap{width:calc(100% - 34px)}header{height:72px}.logo{width:155px;flex-basis:155px}.links{display:none;position:absolute;top:72px;left:0;right:0;background:var(--paper);padding:22px 25px;flex-direction:column;align-items:flex-start;border-bottom:1px solid var(--line)}.links.open{display:flex}.nav-cta{display:none}.menu{display:block}.hero h1{font-size:48px}.hero-copy{padding:55px 24px}.hero-visual{min-height:350px}.benefit{padding:17px 12px;gap:9px}.benefit .symbol{width:29px;height:29px;font-size:15px}.benefit strong{font-size:14px}.benefit small{font-size:9px}section{padding:70px 0}.intro-art{padding:14px}.intro-art img{height:260px}.science-points{gap:16px}.science-visual{padding:12px}.science-visual img{height:260px}.product-visual{min-height:340px}.jar{transform:scale(.86)}.product-facts{gap:12px}.treatment-grid{grid-template-columns:1fr}.treatment-card{min-height:340px}.partner-photo{height:340px}.partner-pillars{gap:8px}.partner-pillars div{font-size:12px}.footer-row{flex-direction:column;text-align:center}.wa{right:12px;bottom:12px;padding:13px 15px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*:before,*:after{transition:none!important}}
</style>
